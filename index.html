<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iSpectrum — access</title>
<meta name="description" content="iSpectrum licence (MT4 indicator, Private Research and Tutorials included). Pay by crypto (Crypto Pay) or card (Whop).">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://tosszbmacumhmmdyegol.supabase.co; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>
<body>
<header><div class="wrap"><a class="brand" href="./"><img src="logo_t.png" alt="iSpectrum" width="307" height="72"></a>
  <nav class="topnav"><a href="chart.html" data-t="nav_chart"></a></nav>
  <div class="lang"><button data-lang="en">EN</button><button data-lang="ru">RU</button></div></div></header>
<main class="wrap">
  <h1 data-t="h1"></h1>
  <p class="lead" data-t="lead"></p>
  <div class="banner" id="closed" data-t="closed"></div>

  <section class="card chartlink">
    <h2 data-t="ch_title"></h2>
    <p class="note top0" data-t="ch_desc"></p>
    <a class="btn" href="chart.html" data-t="ch_open"></a>
  </section>

  <section class="card" id="status" aria-live="polite">
    <h2 data-t="st_title"></h2>
    <div id="st_body"></div>
  </section>

  <section class="card">
    <h2 data-t="sub_title"></h2>
    <div class="price"><span id="sub_price">80</span> USDT <small data-t="sub_per"></small></div>
    <ul class="inc"><li data-t="sub_i1"></li><li data-t="sub_i2"></li><li data-t="sub_i3"></li></ul>
    <div class="pay">
      <button class="btn" data-buy="sub30" data-method="crypto" data-t="pay_crypto"></button>
      <button class="btn alt" data-buy="sub30" data-method="whop" data-t="pay_card"></button>
    </div>
    <p class="note" data-t="sub_note"></p>
  </section>

  <!-- Off until /config lists screenshot products and sales are enabled. No buy button or price before that. -->
  <section class="card" id="scr_card" hidden>
    <h2 data-t="scr_title"></h2>
    <p class="note top0" data-t="scr_desc"></p>
    <div class="opts" id="scr_opts"></div>
    <div class="pay">
      <button class="btn" data-buy="scr" data-method="crypto" data-t="pay_crypto" disabled></button>
    </div>
    <p class="note" data-t="scr_note"></p>
  </section>

  <section class="card">
    <h2 data-t="how_title"></h2>
    <ol class="inc steps"><li data-t="how1"></li><li data-t="how2"></li><li data-t="how3"></li></ol>
  </section>
</main>
<footer class="wrap">
  <p><b data-t="disc_b"></b> <span data-t="disc"></span></p>
  <p><a href="terms.html" data-t="terms"></a> · <a href="privacy.html" data-t="privacy"></a> · <a href="https://t.me/iSpectrumAccessBot" rel="noopener">@iSpectrumAccessBot</a> · <a href="https://t.me/iSpectrum_roadmaps" rel="noopener">t.me/iSpectrum_roadmaps</a></p>
</footer>
<script src="app.js"></script>
</body>
</html>
